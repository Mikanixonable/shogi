<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>将棋の囲い図鑑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='7' fill='%23c8371f'/%3E%3Crect x='9.5' y='9.5' width='45' height='45' rx='3' fill='none' stroke='%23fbf6ea' stroke-width='2.4'/%3E%3Cg stroke='%23fbf6ea' stroke-width='5' stroke-linecap='square'%3E%3Cpath d='M20 20h24M22 32h20M17 45h30M32 20v25'/%3E%3C/g%3E%3Ccircle cx='41' cy='39' r='2.8' fill='%23fbf6ea'/%3E%3C/svg%3E">
<script>
  // 明暗: 切替ボタンの選択を記憶して適用する（未選択はライト）。CSS より先に属性を立ててチラつきを防ぐ
  try { document.documentElement.dataset.theme = localStorage.getItem('shogi-theme') || 'light'; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;600&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/tactics.css">
<link rel="stylesheet" href="css/clusters.css">
<link rel="stylesheet" href="css/matchup.css">
<link rel="stylesheet" href="css/constraint.css">
<link rel="stylesheet" href="css/dock.css">
</head>
<body>
<div class="atmo" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--wood-1)"/><stop offset="1" style="stop-color:var(--wood-2)"/></linearGradient></defs>
</svg>

<!-- 全体の表示設定（左: 画面の切り替え、右: 表示設定） -->
<header class="glass">
  <div class="brand"><span class="mark" aria-hidden="true">玉</span><h1>将棋の囲い図鑑</h1><span class="sub">先手の囲いを盤面で見比べる</span></div>
  <div class="seg nav" id="viewSeg" role="group" aria-label="画面の切り替え">
    <button data-value="board">盤</button>
    <button data-value="cluster">分類マップ</button>
  </div>
  <div class="tools" id="tools">
    <div class="setting">
      <span class="lbl">駒の表示</span>
      <div class="seg" id="modeSeg">
        <button data-value="all">全駒</button>
        <button data-value="dim">囲いを強調</button>
        <button data-value="core">囲いのみ</button>
      </div>
    </div>
    <label class="switch"><input type="checkbox" id="heat"> 守りの利き</label>
    <div class="setting" id="heatScopeWrap">
      <div class="seg small" id="heatScopeSeg" title="利きを数える駒">
        <button data-value="core">囲いの駒</button>
        <button data-value="all">全ての駒</button>
      </div>
    </div>
    <label class="switch"><input type="checkbox" id="skeleton"> 骨格線</label>
  </div>
  <button class="ib" id="toolsToggle" type="button" aria-label="表示設定を開く" aria-expanded="false" aria-controls="tools" title="表示設定">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2.4"/><circle cx="8" cy="16" r="2.4"/></svg>
  </button>
  <button class="ib" id="themeToggle" type="button" aria-label="テーマ切替" title="ライト/ダークを切り替える">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="i-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
      <g class="i-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"/></g>
    </svg>
  </button>
</header>

<!-- 各パネルは view-pane を画面ごとに持つ。画面は「盤（board）」と「分類マップ（cluster）」の2つ -->
<div class="app">
  <!-- 選ぶ（左ドック: 上下2面の分割ペイン。各面は who×tab の対象切替＋タイル一覧。DockView） -->
  <nav class="panel glass rail" aria-label="一覧">
    <div class="view-pane pane-fill" data-view="board" id="pickRail"></div>
    <div class="view-pane pane-fill" data-view="cluster" id="clusterRail"></div>
  </nav>

  <!-- 見る: 盤を挟んで敵（上）・味方（下）の帯。敵なしのときは味方の帯が盤の上に来る（従来どおり） -->
  <main class="panel glass stage" id="stageMain">
    <div class="view-pane" data-view="board" id="boardPane">
      <div class="sideband" id="bandOpp" data-side="opp" hidden>
        <div class="sband-h">
          <span class="who">相手<small>後手</small></span>
          <div class="ttl"><h3 class="sband-name" id="nameOpp"></h3><div class="rd"><span class="sband-sub" id="subOpp"></span></div></div>
          <button class="sband-clear" id="clearOpp" type="button" title="相手の制約をすべて外す">相手をはずす</button>
        </div>
        <div class="cbar" id="cbarOpp" role="group" aria-label="相手の制約条件"></div>
      </div>
      <div class="sideband" id="bandMe" data-side="me">
        <div class="sband-h" id="stageH">
          <span class="who">自分<small>先手</small></span>
          <div class="ttl" id="ttl"><h3 class="sband-name" id="nameMe"></h3><div class="rd"><span class="sband-sub" id="subMe"></span></div></div>
          <button class="sband-clear" id="clearMe" type="button" title="自分の制約をすべて外す">自分をはずす</button>
        </div>
        <div class="cbar" id="cbarMe" role="group" aria-label="自分の制約条件"></div>
      </div>
      <div class="stage-f" id="stageF">
        <span class="legend" id="legend"></span>
        <label class="switch" id="threatWrap" title="相手の飛車の筋・主役の経路の終点の筋"><input type="checkbox" id="threatSw"> 脅威の帯</label>
        <button class="sband-clear" id="clearAll" type="button" title="両側の制約をすべて外す">すべてはずす</button>
        <button class="play-btn" id="playBtn" type="button">順に再生</button>
      </div>
    </div>
    <div class="view-pane pane-fill" data-view="cluster" id="clusterStage"></div>
    <!-- 盤（BoardView / OverlayView は1組だけ） -->
    <div class="view-pane board-pane" data-view="board">
      <div class="boardarea">
        <!-- 持ち駒は盤の左右に立てる（伝統的な記法。敵=左・味方=右） -->
        <div class="handcol" id="handOpp" role="note" aria-label="相手の持ち駒"></div>
        <div class="boardwrap" id="boardwrap">
          <div id="ptable" class="ptable" role="group" aria-label="戦法の周期表（盤の筋とそろえた表）"></div>
          <div class="flabels" id="files"></div><div></div>
          <div class="board" id="board"></div>
          <div class="rlabels" id="ranks"></div>
        </div>
        <div class="handcol" id="handMe" role="note" aria-label="自分の持ち駒"></div>
      </div>
    </div>
  </main>

  <!-- 読む（右ドック。BoardDetailView が選択中の制約の種類に応じて組み立てる） -->
  <aside class="panel glass detail">
    <div class="view-pane" data-view="board">
      <div class="detail-body" id="detail"></div>
    </div>
    <div class="view-pane pane-fill" data-view="cluster" id="clusterDetail"></div>
    <div class="vert" aria-hidden="true">先手の囲いを盤で見比べる</div>
  </aside>
</div>

<!-- スクリプト一覧（読み込み順は js/manifest.js が決める。file:// でも動くよう動的に追加） -->
<script src="js/manifest.js"></script>
<script>
  for (const src of Kakoi.MANIFEST.order) {
    const s = document.createElement('script');
    s.src = src;
    s.async = false; // 追加順どおりに実行させる
    document.body.appendChild(s);
  }
</script>
</body>
</html>
