<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>将棋の囲い図鑑</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<div class="atmo" aria-hidden="true"><b></b><b></b><b></b></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--wood-1)"/><stop offset="1" style="stop-color:var(--wood-2)"/></linearGradient></defs>
</svg>

<!-- 全体の表示設定 -->
<header class="glass">
  <div class="brand"><span class="mark" aria-hidden="true">玉</span><h1>将棋の囲い図鑑</h1><span class="sub">先手の囲いを盤面で見比べる</span></div>
  <div class="setting">
    <span class="lbl">駒の表示</span>
    <div class="seg" id="modeSeg">
      <button data-value="all">全駒</button>
      <button data-value="dim">囲いを強調</button>
      <button data-value="core">囲いのみ</button>
    </div>
  </div>
  <label class="switch"><input type="checkbox" id="heat"> 守りの利き</label>
  <div class="setting" id="heatScopeWrap">
    <div class="seg small" id="heatScopeSeg" title="利きを数える駒">
      <button data-value="core">囲いの駒</button>
      <button data-value="all">全ての駒</button>
    </div>
  </div>
</header>

<div class="app">
  <!-- 選ぶ -->
  <nav class="panel glass rail" aria-label="囲いの一覧">
    <div class="seg wide" id="sideSeg">
      <button data-value="ibisha">居飛車</button>
      <button data-value="furibisha">振り飛車</button>
    </div>
    <div class="rail-h"><span class="count" id="railCount"></span><span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> で移動</span></div>
    <div class="cards" id="cards"></div>
  </nav>

  <!-- 見る -->
  <main class="panel glass stage">
    <div class="stage-h">
      <div class="ttl" id="ttl"><h2 id="title"></h2><div class="rd"><span id="reading"></span><span class="setup" id="setup"></span></div></div>
    </div>
    <div class="boardarea">
      <div class="boardwrap">
        <div class="flabels" id="files"></div><div></div>
        <div class="board" id="board"></div>
        <div class="rlabels" id="ranks"></div>
      </div>
    </div>
    <div class="stage-f">
      <span class="legend" id="legend"></span>
      <span class="hand" id="hand"></span>
    </div>
  </main>

  <!-- 読む -->
  <aside class="panel glass detail">
    <div class="seg small wide tabs" id="detailTabs">
      <button data-value="overview">概要</button>
      <button data-value="proscons">長所・短所</button>
      <button data-value="attacks">攻め筋</button>
      <button data-value="sources">出典</button>
    </div>
    <div class="detail-body" id="detail"></div>
  </aside>
</div>

<!-- データ -->
<script src="js/core/notation.js"></script>
<script src="js/data/sources.js"></script>
<script src="js/data/setups.js"></script>
<script src="js/data/castles-ibisha.js"></script>
<script src="js/data/castles-furibisha.js"></script>
<!-- ロジック -->
<script src="js/core/position.js"></script>
<script src="js/core/attack-map.js"></script>
<!-- 表示 -->
<script src="js/ui/store.js"></script>
<script src="js/ui/segmented.js"></script>
<script src="js/ui/mini-board.js"></script>
<script src="js/ui/board-view.js"></script>
<script src="js/ui/rail-view.js"></script>
<script src="js/ui/toolbar-view.js"></script>
<script src="js/ui/stage-view.js"></script>
<script src="js/ui/detail-view.js"></script>
<script src="js/app.js"></script>
</body>
</html>
